services:
  app:
    image: ghcr.io/nanashithenameless/anonshock:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SOCKET_PATH: /run/anonshock/anonshock.sock
    # No TCP listener at all. cloudflared reaches the app through this socket.
    volumes:
      - anonshock-data:/data
      - anonshock-run:/run/anonshock
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get({socketPath:'/run/anonshock/anonshock.sock',path:'/healthz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
      TUNNEL_TRANSPORT_PROTOCOL: auto
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - anonshock-run:/run/anonshock
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  anonshock-data:
  anonshock-run:
